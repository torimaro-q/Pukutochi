<svg
  width="100%"
  height="300"
  viewBox="0 0 600 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <clipPath id="viewport">
      <rect width="600" height="300"/>
    </clipPath>
  </defs>

  <g clip-path="url(#viewport)">
    <g>
      <image href="screen1.png" x="0" y="10" width="600" height="280"/>
      <image href="screen2.png" x="600" y="10" width="600" height="280"/>
      <image href="screen3.png" x="1200" y="10" width="600" height="280"/>

      <!-- ループ用に1枚目を複製 -->
      <image href="screen1.png" x="1800" y="10" width="600" height="280"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1800 0"
        dur="30s"
        repeatCount="indefinite"
      />
    </g>
  </g>
</svg>